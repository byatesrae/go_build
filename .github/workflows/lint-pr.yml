name: Lint Pull Request

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v3
        with:
          go-version: 1.24.4
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.60.2
          args: -c ./devops/common/.golangci.verbose.yml --issues-exit-code=0
          only-new-issues: true
